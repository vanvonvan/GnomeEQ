<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- GnomeEQ panel icon: three fader tracks with knobs at different heights,
       the universal shorthand for a graphic equalizer. `currentColor` follows
       the panel foreground, so it adapts to light and dark themes.

       NOTE: keep this comment INSIDE <svg>. A comment between the <?xml?>
       declaration and the root element makes GdkPixbuf fail to recognize the
       file at all ("Couldn't recognize the image file format"), and the panel
       icon then renders as nothing. -->
  <g fill="currentColor">
    <rect x="3.25"  y="2" width="1.5" height="12" rx="0.75" opacity="0.45"/>
    <rect x="7.25"  y="2" width="1.5" height="12" rx="0.75" opacity="0.45"/>
    <rect x="11.25" y="2" width="1.5" height="12" rx="0.75" opacity="0.45"/>
    <rect x="1.5" y="9.25" width="5" height="2.5" rx="1.25"/>
    <rect x="5.5" y="4.25" width="5" height="2.5" rx="1.25"/>
    <rect x="9.5" y="7.25" width="5" height="2.5" rx="1.25"/>
  </g>
</svg>
