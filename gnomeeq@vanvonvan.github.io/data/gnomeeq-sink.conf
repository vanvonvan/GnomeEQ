# GnomeEQ — 11-band graphic equalizer sink
#
# Generated by tools/gen_sink_conf.py — do not edit by hand.
# Installed to ~/.config/pipewire/filter-chain.conf.d/99-gnomeeq-sink.conf
# and served by the (already enabled) filter-chain.service daemon.
#
# Creates a virtual sink "GnomeEQ". Make it the default output and every app
# is equalized — browser, game, VLC — because apps just follow the default
# sink. Band gains are set LIVE on the node's Props param, so switching a
# preset is instant and never interrupts audio.
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "GnomeEQ"
            media.name       = "GnomeEQ"
            filter.graph = {
                nodes = [
                    {
                        type  = builtin
                        name  = preamp
                        label = linear
                        control = { "Mult" = 1.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_1
                        label = bq_peaking
                        control = { "Freq" = 20.0 "Q" = 1.414 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_2
                        label = bq_peaking
                        control = { "Freq" = 40.0 "Q" = 1.414 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_3
                        label = bq_peaking
                        control = { "Freq" = 80.0 "Q" = 1.414 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_4
                        label = bq_peaking
                        control = { "Freq" = 160.0 "Q" = 1.414 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_5
                        label = bq_peaking
                        control = { "Freq" = 315.0 "Q" = 1.414 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_6
                        label = bq_peaking
                        control = { "Freq" = 630.0 "Q" = 1.414 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_7
                        label = bq_peaking
                        control = { "Freq" = 1250.0 "Q" = 1.414 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_8
                        label = bq_peaking
                        control = { "Freq" = 2500.0 "Q" = 1.414 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_9
                        label = bq_peaking
                        control = { "Freq" = 5000.0 "Q" = 1.414 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_10
                        label = bq_peaking
                        control = { "Freq" = 10000.0 "Q" = 1.414 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_11
                        label = bq_peaking
                        control = { "Freq" = 20000.0 "Q" = 1.414 "Gain" = 0.0 }
                    }
                ]
                links = [
                    { output = "preamp:Out" input = "eq_band_1:In" }
                    { output = "eq_band_1:Out" input = "eq_band_2:In" }
                    { output = "eq_band_2:Out" input = "eq_band_3:In" }
                    { output = "eq_band_3:Out" input = "eq_band_4:In" }
                    { output = "eq_band_4:Out" input = "eq_band_5:In" }
                    { output = "eq_band_5:Out" input = "eq_band_6:In" }
                    { output = "eq_band_6:Out" input = "eq_band_7:In" }
                    { output = "eq_band_7:Out" input = "eq_band_8:In" }
                    { output = "eq_band_8:Out" input = "eq_band_9:In" }
                    { output = "eq_band_9:Out" input = "eq_band_10:In" }
                    { output = "eq_band_10:Out" input = "eq_band_11:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name        = "effect_input.gnomeeq"
                node.description = "GnomeEQ"
                node.nick        = "GnomeEQ"
                media.class      = Audio/Sink
                # module-filter-chain leaves its nodes UNregistered by default,
                # which keeps filter internals out of the session manager. For
                # the capture side that is wrong: an unregistered node is never
                # adopted by WirePlumber, so it does not appear in `wpctl
                # status`, GNOME's Sound settings cannot see it, and
                # gsd-media-keys logs "Unable to get default sink" — the volume
                # keys stop working once this sink is the default.
                object.register  = true
                device.icon-name = "audio-card-symbolic"
            }
            playback.props = {
                node.name    = "effect_output.gnomeeq"
                node.passive = true
            }
        }
    }
]
